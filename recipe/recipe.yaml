schema_version: 1

context:
  name: gravitools
  version: "0.3.0"

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gravitools/gravitools-${{ version }}.tar.gz
  sha256: 5c3cb4e83b7dc634f7302d3e480fc02f0eec02ef365e82d877476e9055da8f28

build:
  number: 0

outputs:
  - package:
      name: ${{ name }}
      version: ${{ version }}
    build:
      python:
        entry_points:
          - gt-aqg-proc = gravitools.aqg.cli:main
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - python >=${{ python_min }}
        - allantools
        - fpdf2
        - matplotlib-base
        - netcdf4
        - numpy
        - packaging
        - pandas
        - pyyaml
        - requests
        - xarray
    tests:
      - python:
          imports:
            - gravitools
          # issue opened at 'allantools'-feedstock: https://github.com/conda-forge/allantools-feedstock/issues/7 
          # issue for fixing above: https://github.com/conda-forge/allantools-feedstock/pull/8
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: ${{ name }}-dashboard
      version: ${{ version }}
    build:
      python:
        entry_points:
          - gt-aqg-proc = gravitools.aqg.cli:main
          - gt-aqg-dash = gravitools.aqg.dashboard:main
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - python >=${{ python_min }}
        - allantools
        - fpdf2
        - matplotlib-base
        - netcdf4
        - numpy
        - packaging
        - pandas
        - pyyaml
        - requests
        - xarray
        - pyqtgraph
        - PySide6
    tests:
      - python:
          imports:
            - gravitools
          # issue opened at 'allantools'-feedstock: https://github.com/conda-forge/allantools-feedstock/issues/7 
          # issue for fixing above: https://github.com/conda-forge/allantools-feedstock/pull/8
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  homepage: https://pypi.org/project/gravitools/
  repository: https://gitlab.opencode.de/bkg/gravitools
  summary: A collection of tools for gravimeter data analysis
  documentation: https://gravitools.readthedocs.io/
  license: EUPL-1.2
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - marcianito
  feedstock-name: gravitools
